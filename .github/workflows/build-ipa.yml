name: Build IPA

on:
  workflow_dispatch:        # 在 Actions 分頁手動按 Run workflow
  push:
    paths:
      - "ios/**"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 產生 Xcode 專案
        working-directory: ios
        run: xcodegen generate

      - name: 編譯（不簽章，交給 Sideloadly 簽）
        working-directory: ios
        run: |
          xcodebuild -project LAMHead.xcodeproj -scheme LAMHead \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LAMHead.app Payload/
          zip -qry LAMHead.ipa Payload
          ls -lh LAMHead.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LAMHead-ipa
          path: ios/LAMHead.ipa
          retention-days: 14
