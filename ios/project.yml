# XcodeGen 專案設定：GitHub Actions 會用它自動產生 LAMHead.xcodeproj
name: LAMHead
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  LAMHead:
    type: application
    platform: iOS
    sources:
      - path: LAMHead
      # Kaggle 腳本打包進 App，每次送件時上傳到 Kaggle
      - path: ../kaggle/lam_job.py
        buildPhase: resources
      - path: ../kaggle/lam_env_build.py
        buildPhase: resources
      - path: ../kaggle/lam_server.py
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lamhead
        PRODUCT_NAME: LAMHead
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: LAMHead/Info.plist
      properties:
        CFBundleDisplayName: 3D頭像
        NSCameraUsageDescription: 拍攝要生成 3D 頭像的照片
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  LAMHead:
    build:
      targets:
        LAMHead: all
